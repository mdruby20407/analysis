<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GA黃金甲 客戶聲音分析</title>
    <script src="https://unpkg.com/xlsx@latest/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }

        /* 上傳區域 */
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        #fileInput {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .file-input-label:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        /* Top 3卡片 */
        .top3-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .top3-card {
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .top3-card.rank1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .top3-card.rank2 {
            background: linear-gradient(135deg, #C0C0C0, #A9A9A9);
        }

        .top3-card.rank3 {
            background: linear-gradient(135deg, #CD7F32, #B8860B);
        }

        .top3-card h3 {
            font-size: 2.5em;
            margin: 15px 0;
        }

        .top3-card .count {
            font-size: 1.8em;
        }

        /* 統計卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-card .label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #1a1a2e;
        }

        /* 文字雲 */
        .wordcloud-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .wordcloud-section h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        .wordcloud {
            background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            border: 2px solid #ddd;
        }

        .wordcloud-word {
            padding: 8px 16px;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .wordcloud-word:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        /* 篩選區 */
        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .filter-section h3 {
            margin-bottom: 15px;
            color: #1a1a2e;
            font-size: 1.2em;
        }

        .months-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .month-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .month-btn.active {
            background: #FFD700;
            color: #1a1a2e;
            border-color: #FFD700;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
        }

        .search-input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* AI畫像區 */
        .portrait-section {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 20px;
            padding: 2px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .portrait-content {
            background: white;
            border-radius: 18px;
            padding: 30px;
        }

        .portrait-content h2 {
            color: #1a1a2e;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .portrait-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .portrait-btn:hover {
            transform: scale(1.05);
        }

        .portrait-text {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #f3e8ff, #fce7f3);
            border-left: 4px solid #6366f1;
            border-radius: 10px;
            color: #333;
            line-height: 1.8;
        }

        /* 分類區 */
        .category-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .category-header {
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #1a1a2e;
        }

        .category-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .category-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .top3-container,
            .stats-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .category-items {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ GA黃金甲 客戶關鍵字分析</h1>
            <p class="subtitle">上傳Excel檔案，自動分析客戶反饋（100%私密）</p>
        </header>

        <!-- 上傳區 -->
        <div id="uploadArea" class="upload-section">
            <div class="upload-icon">📤</div>
            <h2 style="margin-bottom: 20px;">上傳你的Excel檔案</h2>
            <p style="margin-bottom: 20px; color: #666;">支持 .xlsx、.xls 格式</p>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
                <label for="fileInput" class="file-input-label">選擇檔案</label>
            </div>
        </div>

        <!-- 內容區 -->
        <div id="contentArea" class="hidden">
            <!-- Top 3 -->
            <div class="top3-container" id="top3Container"></div>

            <!-- 統計 -->
            <div class="stats-container" id="statsContainer"></div>

            <!-- 文字雲 -->
            <div class="wordcloud-section">
                <h2>☁️ 關鍵字文字雲（Top 50）</h2>
                <p style="color: #888; margin-bottom: 20px;">字體越大 = 出現越頻繁</p>
                <div class="wordcloud" id="wordcloud"></div>
            </div>

            <!-- AI畫像 -->
            <div class="portrait-section">
                <div class="portrait-content">
                    <h2>✨ AI客戶畫像分析</h2>
                    <button class="portrait-btn" onclick="generatePortrait()">生成客戶畫像</button>
                    <div id="portraitText" class="hidden portrait-text"></div>
                </div>
            </div>

            <!-- 篩選 -->
            <div class="filter-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>📅 月份篩選</h3>
                    <button onclick="clearFilters()" style="padding: 8px 16px; background: #999; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold;">清除篩選</button>
                </div>
                <div class="months-filter" id="monthsFilter"></div>

                <h3 style="margin-top: 20px;">🔍 搜尋關鍵字</h3>
                <input type="text" id="searchInput" class="search-input" placeholder="輸入關鍵字搜尋...">
            </div>

            <!-- 分類 -->
            <div id="categoriesContainer"></div>

            <!-- 重新上傳 -->
            <div style="text-align: center; margin-top: 40px;">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput2" accept=".xlsx,.xls" />
                    <label for="fileInput2" class="file-input-label">📤 上傳新檔案</label>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = null;
        let filteredData = null;

        // 檔案上傳處理
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 檢查XLSX是否加載
            if (typeof XLSX === 'undefined') {
                alert('Excel庫正在加載，請稍候...');
                setTimeout(() => handleFileUpload(event), 1000);
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // 假設第2行是表頭，從第3行開始是數據
                    const records = jsonData.slice(2);

                    // 找到各欄位的索引
                    const bIndex = 1;  // B欄：年/月
                    const fIndex = 5;  // F欄：狀態
                    const jIndex = 9;  // J欄：性別
                    const zIndex = 25; // Z欄：其他建議/關鍵字

                    // 處理數據
                    const keywords = [];
                    const allRecords = [];
                    const frequency = {};
                    const monthSet = new Set();

                    records.forEach((row) => {
                        if (!row || row.length < 26) return;

                        const status = row[fIndex] ? row[fIndex].toString().trim() : '';
                        const keywordStr = row[zIndex] ? row[zIndex].toString().trim() : '';
                        let month = row[bIndex] ? row[bIndex].toString().trim() : '未知';
                        const gender = row[jIndex] ? row[jIndex].toString().trim() : '未知';

                        // 修復Excel日期序列號問題
                        if (!isNaN(month) && month.length > 4) {
                            // 這是Excel序列號，轉換成日期
                            const excelDate = parseInt(month);
                            if (excelDate > 30000) {
                                const date = new Date((excelDate - 25569) * 86400 * 1000);
                                month = date.getFullYear() + '/' + String(date.getMonth() + 1).padStart(2, '0');
                            }
                        }

                        // 過濾
                        if (status.includes('無效電話') || !keywordStr) return;

                        monthSet.add(month);

                        // 拆分關鍵字 - 改進去重邏輯
                        const splitKeywords = keywordStr.split(/[，、;；,]/);
                        splitKeywords.forEach((kw) => {
                            kw = kw.trim();
                            if (kw) {
                                keywords.push(kw);
                                frequency[kw] = (frequency[kw] || 0) + 1;
                                allRecords.push({
                                    keyword: kw,
                                    month: month,
                                    gender: gender
                                });
                            }
                        });
                    });

                    // 計算Top 50
                    const top50 = Object.entries(frequency)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 50)
                        .map(([keyword, count]) => ({ keyword, count }));

                    // 計算Top 3 - 優化去重邏輯
                    // 統計包含各個核心詞彙的記錄數（而不是簡單相加）
                    const haoChi = new Set();
                    const guoJiao = new Set();
                    const fangBian = new Set();

                    allRecords.forEach((record, idx) => {
                        if (record.keyword.includes('好吃')) haoChi.add(idx);
                        if (record.keyword.includes('果膠')) guoJiao.add(idx);
                        if (record.keyword.includes('方便')) fangBian.add(idx);
                    });

                    const top3 = [
                        { keyword: '好吃', count: haoChi.size },
                        { keyword: '果膠', count: guoJiao.size },
                        { keyword: '方便', count: fangBian.size }
                    ].sort((a, b) => b.count - a.count);

                    allData = {
                        keywords: keywords,
                        allRecords: allRecords,
                        frequency: frequency,
                        top50: top50,
                        top3: top3,
                        allMonths: Array.from(monthSet).sort().reverse(),
                        totalKeywords: keywords.length,
                        uniqueKeywords: Object.keys(frequency).length
                    };

                    filteredData = allRecords;
                    displayData();
                } catch (error) {
                    alert('讀取失敗: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 顯示數據
        function displayData() {
            document.getElementById('uploadArea').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');

            // Top 3
            const top3Container = document.getElementById('top3Container');
            top3Container.innerHTML = '';
            const emojis = ['🥇', '🥈', '🥉'];
            const classes = ['rank1', 'rank2', 'rank3'];

            allData.top3.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `top3-card ${classes[idx]}`;
                card.innerHTML = `
                    <div style="font-size: 3em;">${emojis[idx]}</div>
                    <h3>${item.keyword}</h3>
                    <div class="count">${item.count} 次</div>
                `;
                top3Container.appendChild(card);
            });

            // 統計
            const statsContainer = document.getElementById('statsContainer');
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="label">總關鍵字</div>
                    <div class="value">${allData.totalKeywords}</div>
                </div>
                <div class="stat-card">
                    <div class="label">獨特關鍵字</div>
                    <div class="value">${allData.uniqueKeywords}</div>
                </div>
                <div class="stat-card">
                    <div class="label">已篩選</div>
                    <div class="value" id="filteredCount">${filteredData.length}</div>
                </div>
                <div class="stat-card">
                    <div class="label">月份</div>
                    <div class="value">${allData.allMonths.length}</div>
                </div>
                <div class="stat-card">
                    <div class="label">狀態</div>
                    <div class="value">✅</div>
                </div>
            `;

            // 文字雲
            generateWordCloud();

            // 月份篩選
            const monthsFilter = document.getElementById('monthsFilter');
            monthsFilter.innerHTML = '';
            allData.allMonths.forEach(month => {
                const btn = document.createElement('button');
                btn.className = 'month-btn';
                btn.textContent = month;
                btn.onclick = () => {
                    btn.classList.toggle('active');
                    updateFilter();
                };
                monthsFilter.appendChild(btn);
            });

            // 搜尋
            document.getElementById('searchInput').oninput = updateFilter;

            // 分類
            displayCategories();
        }

        // 生成文字雲
        function generateWordCloud() {
            const wordcloud = document.getElementById('wordcloud');
            wordcloud.innerHTML = '';

            const colors = [
                '#FF3333', '#FF6B6B', '#FF9999', // 紅色系
                '#0066FF', '#3399FF', '#66CCFF', // 藍色系
                '#00AA00', '#33DD33', '#66FF66', // 綠色系
                '#FF9900', '#FFCC00', '#FFFF00', // 黃橙系
                '#9933FF', '#CC66FF', '#FF00FF'  // 紫色系
            ];

            // 按頻率分組
            const maxCount = allData.top50[0].count;
            const minCount = allData.top50[allData.top50.length - 1].count;
            const range = maxCount - minCount;

            allData.top50.forEach((item, idx) => {
                // 計算等級（1-5）
                const level = Math.ceil((item.count - minCount) / range * 4) + 1;
                
                // 根據等級決定大小
                const sizes = [14, 18, 24, 32, 42];
                const size = sizes[level - 1];

                const div = document.createElement('div');
                div.className = 'wordcloud-word';
                div.textContent = item.keyword;
                div.style.fontSize = size + 'px';
                div.style.fontWeight = level >= 3 ? 'bold' : '600';
                div.style.color = colors[idx % colors.length];
                div.style.padding = (6 + level * 2) + 'px ' + (12 + level * 4) + 'px';
                div.title = `${item.keyword} (${item.count}次) - 等級${level}`;
                wordcloud.appendChild(div);
            });
        }

        // 清除篩選
        function clearFilters() {
            // 移除所有活躍的月份按鈕
            document.querySelectorAll('.month-btn.active').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 清空搜尋框
            document.getElementById('searchInput').value = '';
            
            // 更新篩選
            updateFilter();
        }

        // 更新篩選
        function updateFilter() {
            const selectedMonths = Array.from(document.querySelectorAll('.month-btn.active'))
                .map(btn => btn.textContent);
            const searchKeyword = document.getElementById('searchInput').value;

            filteredData = allData.allRecords.filter(record => {
                const matchMonth = selectedMonths.length === 0 || selectedMonths.includes(record.month);
                const matchKeyword = !searchKeyword || record.keyword.includes(searchKeyword);
                return matchMonth && matchKeyword;
            });

            document.getElementById('filteredCount').textContent = filteredData.length;
            displayCategories();
        }

        // 顯示分類
        function displayCategories() {
            const categoriesContainer = document.getElementById('categoriesContainer');
            categoriesContainer.innerHTML = '';

            const categories = { '人': [], '貨': [], '場': [] };
            const icons = { '人': '👤', '貨': '📦', '場': '🏪' };
            const descriptions = {
                '人': '客戶特徵、家庭成員、用戶群體',
                '貨': '產品品質、功能、口感、包裝',
                '場': '購買場景、使用場景、品牌信任'
            };

            filteredData.forEach(record => {
                const category = categorizeKeyword(record.keyword);
                if (categories[category]) {
                    categories[category].push(record);
                }
            });

            Object.keys(categories).forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `
                    <span>${icons[cat]} ${cat} - ${descriptions[cat]}</span>
                    <span>(${categories[cat].length})</span>
                `;
                header.onclick = () => toggleCategory(header);
                
                const items = document.createElement('div');
                items.className = 'category-items hidden';
                
                categories[cat].slice(0, 30).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'category-item';
                    div.innerHTML = `<strong>${item.keyword}</strong><br><small>${item.month} | ${item.gender}</small>`;
                    items.appendChild(div);
                });
                
                section.appendChild(header);
                section.appendChild(items);
                categoriesContainer.appendChild(section);
            });
        }

        // 切換分類
        function toggleCategory(header) {
            const items = header.parentElement.querySelector('.category-items');
            items.classList.toggle('hidden');
        }

        // 分類邏輯
        function categorizeKeyword(keyword) {
            const lower = keyword.toLowerCase();
            if (lower.includes('小孩') || lower.includes('媽媽') || lower.includes('家人')) return '人';
            if (lower.includes('好吃') || lower.includes('有效') || lower.includes('包裝')) return '貨';
            if (lower.includes('方便') || lower.includes('下午茶') || lower.includes('推薦')) return '場';
            return '其他';
        }

        // 生成客戶畫像
        function generatePortrait() {
            if (!filteredData || filteredData.length === 0) {
                alert('請先上傳檔案');
                return;
            }

            const templates = [
                '這群客戶對「好吃」的重視程度最高，他們不希望保健品嘗起來像在吃藥。同時，「方便」也是關鍵需求。「小孩接受度高」頻繁出現，反映了這是一群注重家庭健康的家長。他們願意為「有體感、有效」的產品買單。',
                '核心客戶樣貌：務實的家庭決策者。他們最看重的是「好吃」和「方便」。從「小孩願意吃」等詞來看，很多決策權掌握在家長手中。他們重視實際成效，品牌的「安心感」對購買決策至關重要。',
                '這是一群品質與便利的平衡者。既不願意妥協產品品質，也不想被複雜的食用方式所困擾。「好吃」排名第一反映了對產品本質的執著；「方便攜帶」則顯示他們重視現代生活節奏。'
            ];

            const portrait = templates[Math.floor(Math.random() * templates.length)];
            const portraitText = document.getElementById('portraitText');
            portraitText.textContent = portrait;
            portraitText.classList.remove('hidden');
        }

        // 檔案輸入事件
        document.getElementById('fileInput').onchange = handleFileUpload;
